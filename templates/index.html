<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splinter - Nested Todo</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/logo-light.svg" id="favicon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <button id="menu-toggle" class="icon-btn mobile-only" aria-label="Toggle Menu"><i data-lucide="menu"></i></button>
            <button id="back-btn" class="icon-btn" aria-label="Back"><i data-lucide="arrow-left"></i></button>
            <div class="logo">
                <img src="/static/img/logo-light.svg" alt="Splinter Logo" id="app-logo" class="logo-img">
                <h1>Splinter</h1>
            </div>
        </div>
        <div class="top-bar-right">
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                <i data-lucide="moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <div class="app-container" id="app-container">

        <aside class="panel" id="sidebar">
            <nav>
                <div class="sidebar-section">
                    <h2>Smart Lists</h2>
                    <ul id="smart-lists" class="list-group">
                        <li data-id="all" class="list-item active">
                            <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
                                <i data-lucide="inbox"></i> Inbox
                            </div>
                        </li>
                        <li data-id="today" class="list-item">
                            <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
                                <i data-lucide="sun"></i> Today
                            </div>
                        </li>
                        <li data-id="upcoming" class="list-item">
                            <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
                                <i data-lucide="calendar"></i> Upcoming
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="sidebar-section">
                    <h2>My Lists</h2>
                    <ul id="user-lists" class="list-group">

                    </ul>
                    <div class="add-list-container">
                        <button id="add-list-btn" class="btn text-btn">+ New list</button>
                        <input type="text" id="add-list-input" class="hidden" placeholder="List name (Enter to save)">
                    </div>
                </div>
            </nav>
        </aside>


        <main class="panel" id="task-list">
            <div class="task-list-header">
                <h2 id="current-list-title">Inbox</h2>
            </div>
            <div id="root-tasks-container">

            </div>
            <div class="add-task-container">
                <input type="text" id="add-root-task-input" class="task-input" placeholder="Add a new task... (Enter to save)">
            </div>
        </main>


        <aside class="panel" id="detail-view">
            <div id="detail-placeholder" class="detail-placeholder">
                <p>Select a task to view details.</p>
            </div>
            <div id="detail-content" class="detail-content hidden">
                <div class="detail-header">
                    <input type="text" id="detail-title" class="detail-title-input" placeholder="Task title">
                    <button id="detail-status-btn" class="btn outline-btn"><i data-lucide="check" style="width: 14px; height: 14px;"></i> Complete</button>
                </div>
                
                <div class="detail-form">
                    <div class="form-group">
                        <label for="detail-due-date">Due Date</label>
                        <input type="date" id="detail-due-date" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label>Labels</label>
                        <div class="labels-container" id="detail-labels-container">

                        </div>
                        <input type="text" id="detail-add-label" class="form-control" placeholder="Add label (Enter to save)">
                    </div>
                    
                    <div class="form-group">
                        <label for="detail-notes">Notes</label>
                        <textarea id="detail-notes" class="form-control notes-textarea" placeholder="Add details..."></textarea>
                    </div>
                    
                    <div class="form-group subtasks-group">
                        <label>Subtasks</label>
                        <div id="detail-subtasks-container" class="detail-subtasks">

                        </div>
                        <div class="add-subtask-container">
                            <input type="text" id="detail-add-subtask" class="form-control" placeholder="Add a subtask (Enter to save)">
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>


    <div id="context-menu" class="context-menu hidden">
        <button id="ctx-delete-btn" class="ctx-btn text-danger">
            <i data-lucide="trash-2"></i> Delete Task
        </button>
    </div>


    <script src="/static/js/api.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/tasklist.js"></script>
    <script src="/static/js/detail.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
